services:
  - type: web
    name: fraud-assist-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: offline
      - key: PYTHON_VERSION
        value: 3.12.8
